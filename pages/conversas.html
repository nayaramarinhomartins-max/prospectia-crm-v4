<style>
.painel-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--tx-4);
  margin-bottom: 6px;
}
.canal-btn {
  flex: 1;
  font-size: 10px;
  font-weight: 700;
  padding: 5px 4px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--tx-4);
  cursor: pointer;
  transition: all .15s;
  letter-spacing: .3px;
}
.canal-btn:hover { color: var(--tx); border-color: var(--tx-3); }
.canal-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
</style>

<div class="ph">
  <div class="ph-row">
    <div><h1>Conversas</h1><p>Histórico completo de mensagens com seus leads.</p></div>
  </div>
</div>

<div style="display:grid;grid-template-columns:300px 1fr 240px;gap:0;height:calc(100vh - 136px);border:1px solid var(--border);border-radius:var(--r-xl);overflow:hidden;background:var(--surface)">

  <!-- LISTA -->
  <div style="border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden">
    <div style="padding:12px;border-bottom:1px solid var(--border)">
      <div class="srch" style="max-width:100%">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="srch-inp" style="max-width:100%" id="convSearch" placeholder="Buscar..." oninput="filterConversas()">
      </div>
    </div>
    <div style="padding:8px 10px;border-bottom:1px solid var(--border);display:flex;gap:4px">
      <button class="tab active" onclick="filterMode('todos',this)" style="flex:1;font-size:11px;padding:4px 6px">Todos</button>
      <button class="tab" onclick="filterMode('nao_lidas',this)" style="flex:1;font-size:11px;padding:4px 6px">Não lidas</button>
      <button class="tab" onclick="filterMode('humano',this)" style="flex:1;font-size:11px;padding:4px 6px">Humano</button>
    </div>
    <div style="flex:1;overflow-y:auto" id="convList">
      <div class="empty" style="padding:40px 20px">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <p>Carregando...</p>
      </div>
    </div>
  </div>

  <!-- CHAT -->
  <div style="display:flex;flex-direction:column;overflow:hidden">
    <div id="chatHeader" style="padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;min-height:57px">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;padding:20px;text-align:center;color:var(--tx-3)">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:8px;opacity:.4"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span style="font-size:13px">Selecione uma conversa para começar</span>
      </div>
    </div>
    <div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:2px" id="chatMessages"></div>

    <!-- Input — só WhatsApp, sem SMS/Voz aqui -->
    <div id="chatInputArea" style="border-top:1px solid var(--border);padding:10px 14px;display:none;flex-direction:column;gap:8px">
      <div style="display:flex;gap:8px;align-items:flex-end">
        <textarea id="chatInput" class="inp" placeholder="Escreva uma mensagem via WhatsApp..." style="min-height:36px;max-height:100px;height:36px;resize:none;flex:1;padding:8px 11px;border-radius:var(--r-lg)" onkeydown="handleChatKey(event)" oninput="autoResize(this)"></textarea>
        <button class="btn btn-primary btn-icon" onclick="sendMsg()" style="flex-shrink:0;border-radius:var(--r-lg)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- PAINEL LEAD -->
  <div style="border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--surface-2)">

    <div style="padding:11px 14px;border-bottom:1px solid var(--border)">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--tx-4)">Lead</div>
    </div>

    <div style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px">

      <!-- Toggle IA — destaque no topo do painel -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface)">
        <div>
          <div style="font-size:12px;font-weight:700;color:var(--tx)">Atendimento IA</div>
          <div style="font-size:10px;color:var(--tx-4);margin-top:1px">Responde automaticamente</div>
        </div>
        <label class="toggle" style="width:34px;height:20px;flex-shrink:0">
          <input type="checkbox" id="modoToggle" onchange="toggleModo(this.checked)">
          <div class="tgl-track"></div>
          <div class="tgl-thumb" style="width:14px;height:14px;top:3px;left:3px"></div>
        </label>
      </div>

      <!-- Status CRM -->
      <div>
        <div class="painel-label">Status</div>
        <select id="painelStatus" class="inp" style="width:100%;font-size:12px;padding:6px 10px;height:32px" onchange="onPainelStatusChange(this.value)">
          <option value="novo">Lead</option>
          <option value="abordado">Contato Feito</option>
          <option value="Interesse">Interesse</option>
          <option value="Proposta">Proposta</option>
          <option value="Fechado">Fechado</option>
          <option value="Perdido">Perdido</option>
        </select>
      </div>

      <!-- Motivo de perda — só aparece quando Perdido -->
      <div id="painelMotivoWrap" style="display:none">
        <div class="painel-label">Motivo da perda</div>
        <select id="painelMotivo" class="inp" style="width:100%;font-size:12px;padding:6px 10px;height:32px">
          <option value="">Selecionar...</option>
          <option value="sem_interesse">Sem interesse</option>
          <option value="preco">Preço</option>
          <option value="sem_resposta">Sem resposta</option>
          <option value="ja_tem_fornecedor">Já tem fornecedor</option>
          <option value="outro">Outro</option>
        </select>
      </div>

      <!-- Canal de resposta -->
      <div>
        <div class="painel-label">Canal de resposta</div>
        <div style="display:flex;gap:5px">
          <button class="canal-btn" data-canal="whatsapp" onclick="selecionarCanal(this)">WA</button>
          <button class="canal-btn" data-canal="sms"      onclick="selecionarCanal(this)">SMS</button>
          <button class="canal-btn" data-canal="voz"      onclick="selecionarCanal(this)">Voz</button>
        </div>
      </div>

      <!-- Anotações -->
      <div style="display:flex;flex-direction:column;gap:6px">
        <div class="painel-label">Anotações</div>
        <textarea id="anotacaoTxt" class="inp" placeholder="Observações sobre este lead..." style="resize:none;height:110px;font-size:12px;line-height:1.5;padding:8px 10px"></textarea>
      </div>

    </div>

    <!-- Footer -->
    <div style="padding:10px 12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:7px">
      <button id="btnSalvarNota" class="btn btn-primary btn-sm btn-full" onclick="salvarAnotacao()" style="font-size:12px">Salvar</button>
      <div style="font-size:10px;color:var(--tx-4);line-height:1.4">
        A IA monitora sinais de bot e desliga o atendente automaticamente.
      </div>
    </div>

  </div>

</div>
